# Nginx конфігурація для LinuxTest додатку
server {
    listen 80;
    server_name localhost;

    # Кореневий каталог з публічними файлами
    root /var/www/html;
    index index.php index.html;

    # Кодування символів
    charset utf-8;

    # Максимальний розмір запиту (для завантаження файлів)
    client_max_body_size 64M;

    # Заголовки безпеки
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Обробка статичних файлів
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Основне правило маршрутизації
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обробка PHP файлів через PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "error_reporting=E_ALL";
        fastcgi_read_timeout 60;
    }

    # Заборона доступу до прихованих файлів
    location ~ /\. {
        deny all;
    }

    # Заборона доступу до PHP файлів у директорії includes
    location ~* /includes/.*\.php$ {
        deny all;
    }
}
